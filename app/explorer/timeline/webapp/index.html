<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimePath Explorer — Tijdlijn</title>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m, sap.ui.unified"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-frame-options="trusted"
    data-sap-ui-resource-roots='{"primepath.explorer.timeline": "./"}'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport">
  </script>
</head>
<body class="sapUiBody">
  <div
    data-sap-ui-component
    data-name="primepath.explorer.timeline"
    data-id="container"
    data-settings='{"id":"primepath.explorer.timeline"}'
    data-height="100%">
  </div>
</body>
</html>
