_schema-version: "3.1"
ID: primepath-travel-dashboard
version: 1.0.0
description: PrimePath Travel Dashboard — SAP BTP Cloud Foundry deployment

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production

modules:
  # ----------------------------------------------------------------------
  # CAP service (Node.js backend) — mashup TripPin + HANA
  # ----------------------------------------------------------------------
  - name: primepath-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: primepath-db
      - name: primepath-uaa

  # ----------------------------------------------------------------------
  # HANA HDI deployer — verrijkte entiteiten (EmployeeExtension, etc.)
  # ----------------------------------------------------------------------
  - name: primepath-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: primepath-db

resources:
  # SAP HANA Cloud HDI container
  - name: primepath-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # XSUAA — RBAC: TravelCoordinator, TeamLead, HRAdmin (zie xs-security.json, FASE 4)
  - name: primepath-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
