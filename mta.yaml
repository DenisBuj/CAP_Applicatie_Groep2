_schema-version: "3.1"
ID: primepath-travel-dashboard
version: 1.0.0
description: PrimePath Travel Dashboard — SAP BTP Cloud Foundry deployment

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production

modules:

  # ============================================================
  # 1. CAP Node.js backend — mashup TripPin + HANA-extensies
  # ============================================================
  - name: primepath-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: primepath-db
      - name: primepath-destination

  # ============================================================
  # 2. HANA HDI deployer — verrijkingstabellen in HANA Cloud
  # ============================================================
  - name: primepath-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: primepath-db

  # ============================================================
  # 3a. HTML5-app: Trips — Travel Coördinator
  # ============================================================
  - name: primepath-trips-app
    type: html5
    path: app/explorer/trips
    build-parameters:
      build-result: webapp
      builder: custom
      commands: []
      supported-platforms: []

  # ============================================================
  # 3b. HTML5-app: Employees — Team Lead
  # ============================================================
  - name: primepath-employees-app
    type: html5
    path: app/explorer/employees
    build-parameters:
      build-result: webapp
      builder: custom
      commands: []
      supported-platforms: []

  # ============================================================
  # 3c. HTML5-app: Airlines/Insights — HR/Admin
  # ============================================================
  - name: primepath-airlines-app
    type: html5
    path: app/explorer/airlines
    build-parameters:
      build-result: webapp
      builder: custom
      commands: []
      supported-platforms: []

  # ============================================================
  # 4. HTML5-deployer — bundelt de drie apps naar HTML5 App Repo
  # ============================================================
  - name: primepath-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: primepath-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: primepath-trips-app
          artifacts:
            - primepath.explorer.trips.zip
          target-path: resources/
        - name: primepath-employees-app
          artifacts:
            - primepath.explorer.employees.zip
          target-path: resources/
        - name: primepath-airlines-app
          artifacts:
            - primepath.explorer.airlines.zip
          target-path: resources/

resources:

  # ============================================================
  # HANA Cloud HDI container — verrijkingstabellen
  # ============================================================
  - name: primepath-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ============================================================
  # HTML5 App Repository — host (met expliciete service-name)
  # ============================================================
  - name: primepath-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: primepath-html5-repo-host
      service-plan: app-host

  # ============================================================
  # HTML5 App Repository — runtime (Managed Approuter)
  # ============================================================
  - name: primepath-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # ============================================================
  # Destination service — maakt intern primepath-srv-api aan via init_data
  # TripPin-destination maak je handmatig aan in de BTP Cockpit:
  #   Name: TripPin
  #   URL:  https://services.odata.org/TripPinRESTierService
  #   Type: HTTP  Proxy: Internet  Auth: NoAuthentication
  # ============================================================
  - name: primepath-destination
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            existing_destinations_policy: update
            destinations:
              - Name: primepath-srv-api
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: false